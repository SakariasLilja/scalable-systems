services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: trading_timescaledb
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
  
  dotnet-app:
    build: ./InitialAttempt
    container_name: trading_dotnet_app
    env_file:
      - .env
    ports:
      - "5032:5032"
    depends_on:
      - timescaledb

volumes:
  timescaledb_data: