apiVersion: v1
kind: ConfigMap
metadata:
  name: timescaledb-init-sql
  namespace: trading-system
data:
  01-init.sql: |
    CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;

    CREATE TABLE IF NOT EXISTS trading_windows (
        symbol_id VARCHAR(32) NOT NULL,
        window_start TIMESTAMPTZ NOT NULL,
        window_end TIMESTAMPTZ NOT NULL,
        ema_38 DOUBLE PRECISION NOT NULL,
        ema_100 DOUBLE PRECISION NOT NULL,
        last_price DOUBLE PRECISION NOT NULL,
        buy_signal BOOLEAN DEFAULT FALSE,
        sell_signal BOOLEAN DEFAULT FALSE,
        PRIMARY KEY (symbol_id, window_start)
    );

    SELECT create_hypertable('trading_windows', 'window_start', chunk_time_interval => INTERVAL '1 day', if_not_exists => TRUE);

    CREATE INDEX IF NOT EXISTS idx_trading_windows_symbol_time 
    ON trading_windows (symbol_id, window_start DESC);
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  namespace: trading-system
  labels:
    app: timescaledb
spec:
  serviceName: timescaledb
  replicas: 2
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:latest-pg16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: trading-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: trading-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: timescaledb-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/01-init.sql
              subPath: 01-init.sql
              readOnly: true
      volumes:
        - name: init-sql
          configMap:
            name: timescaledb-init-sql
  volumeClaimTemplates:
    - metadata:
        name: timescaledb-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: trading-system
  labels:
    app: timescaledb
spec:
  clusterIP: None
  selector:
    app: timescaledb
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
