apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: trading-system
  labels:
    app: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.4
          imagePullPolicy: IfNotPresent
          args:
            - --api.insecure=true
            - --ping=true
            - --ping.entrypoint=traefik
            - --providers.kubernetescrd=true
            - --providers.kubernetescrd.namespaces=trading-system
            - --entrypoints.web.address=:8000
            - --entrypoints.traefik.address=:8080
          ports:
            - name: web
              containerPort: 8000
            - name: traefik
              containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "3000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: trading-system
  labels:
    app: traefik
spec:
  type: NodePort
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: 8000
    - name: traefik
      port: 8080
      targetPort: 8080
