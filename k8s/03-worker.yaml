apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worker
  namespace: trading-system
  labels:
    app: worker
spec:
  serviceName: worker-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: trading-worker:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: trading-config
            - secretRef:
                name: trading-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: worker-headless
  namespace: trading-system
  labels:
    app: worker
spec:
  clusterIP: None
  selector:
    app: worker
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: trading-system
  labels:
    app: worker
spec:
  selector:
    app: worker
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: worker-0
  namespace: trading-system
  labels:
    app: worker
spec:
  selector:
    statefulset.kubernetes.io/pod-name: worker-0
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: worker-1
  namespace: trading-system
  labels:
    app: worker
spec:
  selector:
    statefulset.kubernetes.io/pod-name: worker-1
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: worker-2
  namespace: trading-system
  labels:
